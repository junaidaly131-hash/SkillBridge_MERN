<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These are the homepage defaults. The production post-build generator
      writes route-specific copies for public pages so search and social bots
      receive the right metadata without executing JavaScript. usePageMeta
      keeps the same values correct after hydration and client navigation.

      Canonical host is www. The apex redirects to it, and robots.txt, the
      sitemap and og:url all agree, so Google is never left choosing a winner.
    -->
    <title>SkillBridge | Skill Exchange &amp; Online Learning in Pakistan</title>
    <meta
      name="description"
      content="SkillBridge is a skill exchange platform in Pakistan. Find verified teachers for one-on-one online learning, or earn by teaching what you know."
    />
    <link rel="canonical" href="https://www.skill-bridge.me/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkillBridge" />
    <meta property="og:url" content="https://www.skill-bridge.me/" />
    <meta property="og:title" content="SkillBridge | Skill Exchange &amp; Online Learning in Pakistan" />
    <meta
      property="og:description"
      content="SkillBridge is a skill exchange platform in Pakistan. Find verified teachers for one-on-one online learning, or earn by teaching what you know."
    />
    <!-- 1200x630. Below that, LinkedIn and WhatsApp drop the image entirely. -->
    <meta property="og:image" content="https://www.skill-bridge.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SkillBridge skill exchange and online learning platform in Pakistan" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X reads its own namespace rather than falling back to og: -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkillBridge | Skill Exchange &amp; Online Learning in Pakistan" />
    <meta
      name="twitter:description"
      content="SkillBridge is a skill exchange platform in Pakistan. Find verified teachers for one-on-one online learning, or earn by teaching what you know."
    />
    <meta name="twitter:image" content="https://www.skill-bridge.me/og-image.png" />

    <meta name="theme-color" content="#2A9D90" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Organization and WebSite only.

      No AggregateRating, Review, Product or Offer markup: there are no real
      reviews behind it yet, and schema that claims ratings a site cannot show
      is exactly what Google issues manual actions for. Add them when they
      describe something true.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.skill-bridge.me/#organization",
            "name": "SkillBridge",
            "alternateName": ["Skill Bridge", "Skill-Bridge", "skill-bridge.me"],
            "url": "https://www.skill-bridge.me/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.skill-bridge.me/assets/logo.png",
              "width": 872,
              "height": 224
            },
            "description": "A skill-exchange marketplace where people book one-on-one sessions with verified teachers, and earn by teaching what they know.",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@skill-bridge.me",
              "url": "https://www.skill-bridge.me/contact",
              "availableLanguage": ["en", "ur"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.skill-bridge.me/#website",
            "url": "https://www.skill-bridge.me/",
            "name": "SkillBridge",
            "alternateName": ["Skill Bridge", "Skill-Bridge", "skill-bridge.me"],
            "publisher": { "@id": "https://www.skill-bridge.me/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
